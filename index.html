<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta name="author" content="Ageu Nunes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3600">

    <title>Team PM - Painel</title>
    <meta name="description" content="Informações">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="painel">

        <!-- LADO ESQUERDO -->
        <section class="containerInfo">

            <!-- POWER BI -->
            <div class="containerDash">
                <div class="window">

                    <iframe
                        class="dash"
                        src="https://app.powerbi.com/view?r=eyJrIjoiMDg1ZjJmNjMtNmEyZC00MmY2LWE0NDYtMDY1YzkyOTMwZjUzIiwidCI6ImMwZmUxZmYwLTg1YjQtNGZlNC1iYzk3LTM4ZmFkNDk1YjkxNiIsImMiOjl9&pageName=d7e7fdabbbe7e5996916"
                        frameborder="0"
                        allowfullscreen="true">
                    </iframe>

                </div>
            </div>


            <!-- CARDS -->
            <div class="containerCards">

                <img
                    src="img/card1.png"
                    class="card"
                    alt="Outubro Rosa">

                <img
                    src="img/card2.png"
                    class="card"
                    alt="Aniversariantes de Outubro">

                <img
                    src="img/card3.png"
                    class="card"
                    alt="2 de Outubro">

            </div>

        </section>


        <!-- NOTÍCIAS DA AVIAÇÃO -->
        <aside class="containerSite">

            <div class="window">

                <iframe
                    class="site"
                    src="https://www.aeroflap.com.br/cat/noticias-da-aviacao/"
                    frameborder="0"
                    scrolling="no"
                    allowfullscreen>
                </iframe>

            </div>

        </aside>

    </main>

</body>

</html>
