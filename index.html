
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="3600">

    <link rel="icon" href="img/logo.png">

    <link rel="stylesheet" href="styles.css">

    <title>Team PM - Painel</title>
</head>

<body>

    <main class="painel">

        <!-- LADO ESQUERDO -->
        <section class="containerInfo">

            <!-- DASHBOARD COMO IMAGEM -->
            <div class="containerDash">

                <div class="window">

                    <img
                        class="dash"
                        src="img/dashboard.png"
                        alt="Dashboard de Salas Comerciais TECA"
                    >

                </div>

            </div>


            <!-- CARDS DE OUTUBRO -->
            <div class="containerCards">

                <img
                    src="img/card1.png"
                    class="card"
                    alt="Outubro Rosa"
                >

                <img
                    src="img/card2.png"
                    class="card"
                    alt="Aniversariantes de Outubro"
                >

                <img
                    src="img/card3.png"
                    class="card"
                    alt="Dia Internacional da Não Violência"
                >

            </div>

        </section>


        <!-- NOTÍCIAS DA AVIAÇÃO -->
        <aside class="containerSite">

            <div class="window">

                <iframe
                    class="site"
                    src="https://www.aeroflap.com.br/cat/noticias-da-aviacao/"
                    title="Notícias da Aviação"
                    scrolling="no"
                    frameborder="0"
                ></iframe>

            </div>

        </aside>

    </main>

</body>

</html>
